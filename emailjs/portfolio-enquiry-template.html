<!--
  EmailJS template for "Portfolio Enquiry".
  Paste this into: EmailJS dashboard → Email Templates → (your template) → Content → Edit Content → Code editor.

  Template settings (right-hand panel):
    Subject:    Portfolio Enquiry — {{name}}
    To Email:   gaurav999vohra@gmail.com
    From Name:  Gaurav's Portfolio
    Reply To:   {{email}}

  Variables are escaped by EmailJS ({{ }}), so visitor input can't inject HTML.
-->
<div style="margin:0;padding:32px 16px;background:#f5f7fb;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#111827;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e6e9f0;border-radius:16px;overflow:hidden;">
    <div style="height:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4);"></div>
    <div style="padding:28px 28px 8px;">
      <p style="margin:0;font-family:'JetBrains Mono',Menlo,monospace;font-size:11px;letter-spacing:2.5px;font-weight:700;color:#4f46e5;">NEW PORTFOLIO ENQUIRY</p>
      <p style="margin:10px 0 0;font-size:15px;color:#64748b;">Someone contacted you through your portfolio.</p>
    </div>

    <div style="padding:16px 28px 8px;">
      <p style="margin:0 0 4px;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Name</p>
      <p style="margin:0 0 18px;font-size:16px;font-weight:600;">{{name}}</p>

      <p style="margin:0 0 4px;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Email</p>
      <p style="margin:0 0 18px;font-size:16px;"><a href="mailto:{{email}}" style="color:#4f46e5;text-decoration:none;">{{email}}</a></p>

      <p style="margin:0 0 6px;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Message</p>
      <div style="margin:0 0 18px;padding:14px 16px;background:#f8fafc;border:1px solid #eef1f6;border-radius:10px;font-size:15px;line-height:1.6;white-space:pre-wrap;">{{message}}</div>

      <p style="margin:0;font-size:12px;color:#94a3b8;">{{sent_at}} · {{source}}</p>
    </div>

    <div style="margin-top:20px;padding:16px 28px;border-top:1px solid #eef1f6;font-size:12px;color:#94a3b8;">
      Sent from Gaurav's Portfolio — reply to this email to respond to {{name}} directly.
    </div>
  </div>
</div>
